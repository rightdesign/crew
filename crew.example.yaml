# crew.yaml — what this ship is, and what it is connected to.
#
# Copy to crew.yaml and fill in. crew.yaml is gitignored: it carries absolute
# paths, machine facts and possibly a key.
#
# Two levels, because a ship is not a project:
#   ship    facts about THIS MACHINE. One per file.
#   routes  one per project this ship works — workspace/project pairs. A
#           machine may hold many.

ship:
  # Becomes the Ship record's name once ships exist (ISSUE-328).
  name: my-laptop
  # Detected from the host (macos | linux | windows). Set only to override.
  # platform: macos
  agent:
    bin: ~/.local/bin/claude
    model: claude-sonnet-5
  # The interpreter your hooks are written for. Defaults to bash on macOS and
  # Linux, PowerShell on Windows. The crew never parses a hook, so the
  # language is entirely yours.
  # shell: bash
  # launchd/systemd hand a script a minimal PATH with no node or package
  # manager on it. Anything the hooks need goes here.
  extraPath: ""
  # Node from each project's .nvmrc. Set false if you do not use nvm.
  useNvm: true
  stateDir: .state
  logFile: /tmp/tablation-crew.log
  # How many agent sessions this machine runs at once. Role queues are
  # disjoint by construction, so this only ever lets DIFFERENT roles overlap
  # (e.g. QA verifying while dev builds) — never two of the same role.
  # maxConcurrentAgents: 2

routes:
  - # workspace/project, both slugs — the same string `crew connect` takes
    # and prints a paste-ready block for. This IS the route's address: `crew
    # run <route>` matches it, and its state file is namespaced by it, so
    # the pair must be unique on this ship.
    route: my-workspace/my-project

    # Per-route safety interlock. Nothing polls, runs an agent, merges or
    # deploys for this route until true. One project can be armed while
    # another stays parked.
    enabled: false

    # Which row of the project's `Projects` table this checkout works — one
    # area of development. Two routes on one tracker stay out of each
    # other's queue because of this. Omit it to see every ticket, which is
    # right for a tracker nobody has sliced.
    area: My Area

    # The checkout this route works in — never the crew's own directory.
    dir: ~/src/my-project
    # Worktrees are created beside it as <prefix><issue number>.
    worktreePrefix: my-project-issue-

    # How fast this route's aging (ISSUE-383) erodes an unpicked ticket's
    # rank toward the front of the queue. Omit it for 1 (pure aging) — this
    # is the operator ranking their OWN commitments ("this is my salaried
    # job, that's my hobby project"), not a property of the board, so it
    # belongs here rather than on the tracker. A rate scalar, never a
    # switch: to stop this route's work being picked at all, set
    # `enabled: false` instead — `weight` cannot starve a route, only make
    # its work surface less often.
    # weight: 1

    # What a host must be to build a repo — any | unix | macos | linux |
    # windows — is declared in THAT repo's own `.crew.yaml` (see
    # docs/REPO_SPEC.md), never here: a route can span repos with different
    # needs, and a repo's build requirements are a fact about the repo, not
    # about whichever board happens to track its tickets.

    # Defaults to https://app.tablation.com when omitted here and on `ship:`.
    # Only needed for a self-hosted tracker.
    # baseUrl: https://app.tablation.com
    # Either set apiKey directly, or point at a file with a KEY=value line.
    # apiKey: "sk_..."
    apiKeyFile: .env
    apiKeyVar: TABLATION_API_KEY

    # A repo the crew works. Most repos should carry their own `.crew.yaml`
    # (see docs/REPO_SPEC.md) declaring their platform, hooks and release
    # settings — a hook is code and belongs beside what it builds.
    #
    # What follows is the FALLBACK for a repo that has no such file, and it
    # is merged per field: the repo wins wherever it speaks, the ship fills
    # the gaps, and `crew doctor` reports anything the repo shadowed.
    hooks:
      test: |
        ok=0
        pnpm --filter backend test || ok=1
        pnpm --filter frontend test || ok=1
        exit "$ok"
      build: pnpm build
      deploy: ./deploy.sh
      # notify receives CREW_LEVEL (ok|warn|fail), CREW_HEADLINE, CREW_DETAIL,
      # CREW_ROUTE and CREW_SHIP in its environment. Omit it and release
      # state just goes to the log. Unlike the others this one is the
      # SHIP's, not the repo's: where release state gets seen is a fact
      # about the machine.
      # notify: ~/bin/my-notifier

    labels:
      test: pnpm test
      build: pnpm build
      deploy: ./deploy.sh

    release:
      # Every file the version is written into. The first is also read from.
      versionFiles: [package.json]
      changelog: CHANGELOG.md

    # DISCOVERED, NOT AUTHORED, and NOT HERE: the uuids for this route's
    # tracker tables and crew rows live in the state tree —
    # <stateDir>/resolved/<workspace>/<project>.json, e.g.
    # state/resolved/my-workspace/my-project.json — not in crew.yaml. `crew
    # connect my-workspace/my-project` writes that file; it may also be
    # hand-filled (see `ResolvedIds` in src/config.ts for the shape) until
    # `crew connect` covers your workspace's needs (ISSUE-285). Nothing in it
    # should be edited to change behaviour — it is a cache, and regenerable.
