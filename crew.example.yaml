# crew.yaml — what this ship is, and what it is connected to.
#
# Copy to ~/.config/crew/crew.yaml (NOT into the checkout): it describes this
# MACHINE, so replacing or reinstalling the crew checkout must not lose it.
# `crew` looks in $CREW_CONFIG, then $XDG_CONFIG_HOME/crew, then
# ~/.config/crew/crew.yaml, and only then beside the checkout.
#
# It holds an API key in plaintext, so: chmod 600.
#
# Unknown keys are an ERROR, not a warning. A typo that silently did nothing
# would be indistinguishable from a setting that does not work.

ship:
  # Must match a row in the board's Ships table — that row is how the crew
  # knows which seats are aboard here rather than on someone else's machine.
  name: "My Mac"

  # Detected from the host. Set it only to override.
  # platform: macos | linux

  agent:
    bin: "/usr/local/bin/claude"     # absolute: a timer runs with a minimal PATH
    model: "claude-sonnet-5"

  # shell: bash                      # defaults per platform
  extraPath: "/opt/homebrew/bin"     # prepended for hooks
  useNvm: true                       # source the repo's .nvmrc before hooks
  # stateDir: "state"                 # defaults to "state", relative to THIS file
  logFile: "/tmp/crew.log"           # give each runner its own file — a shared one interleaves
  # Defaults to "Mozilla/5.0 CrewAgent/<this checkout's version>". The
  # Mozilla/5.0 prefix is load-bearing: Cloudflare blocks a bare tool
  # User-Agent before it reaches the tracker API. Set this only to identify
  # a specific ship in the tracker's own request logs.
  # userAgent: "Mozilla/5.0 CrewAgent/1.0"

  # Where a repo's checkout lives when a route's own `repos:` doesn't say so
  # explicitly (see `repos:` below) — defaults to "~/Crew" if omitted here
  # and at every route. A route-level `reposBasePath:` overrides this one.
  # reposBasePath: "~/Crew"

# One ship, many boards. Each route is one workspace/project pair + one area
# of development within it — `crew run my-workspace/my-product`, the same
# string `crew connect` takes, addresses it; there is no separate `name:` to
# keep in sync with that. Keys are workspace-scoped in general, so a route
# normally carries its own — but if one key happens to be valid for all of
# them (a personal account key), declare it once as `ship.apiKey` instead and
# every route that omits its own picks it up.
routes:
  - route: my-workspace/my-product
    enabled: false                   # nothing writes, wakes an agent or deploys until this is true
    area: "My Product"               # the row of its Projects table this route works

    # An area spans several repositories, and each needs its own checkout on
    # this machine. Keyed by the name the board's Repos table uses. Naming
    # even one repo here makes this a CLOSED list — a ticket for a repo not
    # listed is one this ship deliberately doesn't work (another ship may),
    # and the queue digest marks it NO CHECKOUT rather than leaving it blank.
    repos:
      My Product: "/home/me/src/my-product"
      My Product CLI: "/home/me/src/my-product-cli"

    # Leave `repos:` out entirely instead to serve every repo the board's
    # Repos table lists, each one defaulting to
    # `<reposBasePath>/my-workspace/<repoName>` and cloned there
    # automatically (from that repo's own `remote` column) the first time a
    # ticket actually needs it — nothing to list by hand, nothing fetched
    # up front by `crew connect`.

    # A single-repo route may use `dir:` instead of `repos:`.
    # dir: "/home/me/src/my-product"

    worktreePrefix: "myproject-issue-"
    # What a host must be to build a repo lives in THAT repo's own .crew.yaml
    # (any | unix | macos | linux | windows) — never here. A route can span
    # repos with different needs; the ship refuses a route only when it can
    # satisfy none of them.
    # Defaults to https://app.tablation.com when omitted here and on `ship:`.
    # Only needed for a self-hosted tracker.
    # baseUrl: "https://app.tablation.com"
    apiKey: "REPLACE_ME"             # or omit if `ship.apiKey` covers this workspace too

    # Where release state should be SHOWN is a fact about this machine and the
    # person watching it, not about the code — so unlike every other hook,
    # notify lives here rather than in the repo's .crew.yaml. It receives
    # CREW_LEVEL (ok|warn|fail), CREW_HEADLINE, CREW_DETAIL, CREW_ROUTE
    # and CREW_SHIP, and decides everything else. Define none and release state
    # simply goes to the log.
    #
    # hooks:
    #   notify: 'terminal-notifier -title "$CREW_HEADLINE" -message "$CREW_DETAIL"'

    # Prefer putting hooks, labels and release settings in the REPO's own
    # .crew.yaml (docs/REPO_SPEC.md) rather than here. A repo that carries one
    # shadows anything repeated here, and `crew doctor` reports that as drift.
    # These exist for a repo you cannot add a .crew.yaml to:
    #
    # hooks:
    #   test: "npm test"
    #   build: "npm run build"
    #   deploy: "./deploy.sh"

    # Discovered from the board, not authored by hand, and NOT in this file:
    # `crew connect my-workspace/my-product` (or a matching hand-filled JSON)
    # writes state/resolved/my-workspace/my-product.json — workspaceId,
    # projectId, areaModelId/areaId, the Issues/Comments/Crew model ids, each
    # role's seat, the operator (the human this ship belongs to — set by
    # hand; there is no way to derive it), and any hold (a row a person works
    # through; a ticket assigned to one is off limits to every seat,
    # whatever its status). Without it every cycle would re-resolve the same
    # ids over the network instead of reading a local cache.
