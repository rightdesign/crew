# Publishes the Host Passengers container image to Docker Hub (CREW-1369) when
# a v* tag is pushed. The tag comes from the same release phase as
# publish.yml, so this runs alongside the npm publish, not after it: its own
# job, no `needs`, so a Docker Hub outage cannot hold up an npm release.
#
# Each release pushes tablation/crew-passenger-mcp:<version> and :latest. A
# ship runs the tag matching its own crew version (passengerImageRef in
# src/passenger-containers.ts), so a container is always paired with the
# passenger-mcp.ts it was released with.
#
# A manual run (workflow_dispatch) builds both platforms and pushes nothing.
# That is the check that the image still builds, and it cannot overwrite a
# version that has already been released.
#
# Auth: the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets. The
# tablation namespace must already exist on Docker Hub.
name: Publish Host Passengers image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check package version matches the tag
        if: github.ref_type == 'tag'
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="${{ steps.version.outputs.version }}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::package.json is at $actual but the tag is v$expected"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.passenger-mcp
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            tablation/crew-passenger-mcp:${{ steps.version.outputs.version }}
            tablation/crew-passenger-mcp:latest
