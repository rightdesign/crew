# The crew's contract for its own repository — see docs/REPO_SPEC.md, which
# this file is the first non-trivial example of.
version: 1

# POSIX-shell hooks: macOS or Linux, not Windows.
platform: unix

worktrees:
  # Nothing gitignored is needed to run the tests: no .env, no generated
  # client, no build step. `setup` below is the whole bootstrap.
  copy: []

hooks:
  setup: pnpm install

  # Runs directly, not through `pnpm test`: type stripping means there is no
  # build to do first, and the suite includes an in-process fake board so it
  # touches no network.
  test: node --test --test-timeout 90000 --experimental-strip-types test/*.test.ts

  # Typecheck, then rebuild dist/cli.js — bin/crew runs the built output
  # when present, so a release that skips this step leaves every local
  # runner (launchd/systemd timers, crew-macos) executing a stale bundle
  # until someone happens to rebuild by hand (ISSUE-584).
  build: npx tsc --noEmit && ./node_modules/.bin/tsup src/cli.ts --format esm --clean

  version: node -p "require('./package.json').version"

  # What npm reports as live: matched against the version just released, so
  # the batch's tickets are stamped closed_deployed once publish.yml is done.
  released: npm view @tablation/crew version

release:
  # The release phase bumps package.json, writes CHANGELOG.md, commits
  # `Release vX.Y.Z`, and pushes main plus the annotated tag. The tag push
  # triggers .github/workflows/publish.yml (OIDC Trusted Publishing), which
  # is what actually publishes to npm — crew itself runs no deploy hook.
  mode: ci_auto
  ci: { provider: github }
  versioning: auto
  versionFiles: [package.json]
  changelog: CHANGELOG.md
  verify:
    match: version
    # publish.yml runs install + typecheck + test + build before publish.
    timeoutSeconds: 900
    intervalSeconds: 20
